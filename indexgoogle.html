<!DOCTYPE html>
<html>
<head>
    <title>Google Account</title>
    <link rel="stylesheet" href="stylegoogle.css">
</head>
<body>
    <header class="topbar">
        <a href="indexregistration.html">Back to Registration</a>
        <span>Google Account</span>
    </header>

    <main class="google-card">
        <section class="create-side">
            <div class="google-logo">G</div>
            <h1>Create account</h1>
            <p>New to Google Account? Start creating your account here.</p>
            <a class="button outline" href="indexname.html">Create Account</a>
        </section>

        <section class="signin-side">
            <h1>Sign in</h1>
            <p>Enter your email and password.</p>

            <label for="google-email">Email address</label>
            <input id="google-email" type="email" placeholder="Enter your email">

            <label for="google-password">Password</label>
            <input id="google-password" type="password" placeholder="Enter your password">

            <a class="button" href="indexwelco.html">Next</a>
        </section>
    </main>
</body>
</html>
