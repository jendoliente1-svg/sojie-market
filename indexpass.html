<!DOCTYPE html>
<html>
<head>
    <title>Create a Password</title>
    <link rel="stylesheet" href="stylepass.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="left">
                <div class="google">G</div>
                <h1>Create a strong password</h1>
                <p>Use a mixture of letters, numbers, and symbols.</p>
            </div>
            <div class="right">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Create a password">

                <label for="confirm">Confirm password</label>
                <input id="confirm" type="password" placeholder="Confirm password">

                <div class="actions">
                    <a class="button secondary" href="indexname.html">Back</a>
                    <a class="button" href="indexinfo.html">Next</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
