<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="styleregis.css">
</head>
<body>
    <header class="topbar">
        <a href="indexhome.html">Home</a>
        <span>Registration</span>
    </header>

    <main class="simple-card">
        <div class="google">G</div>
        <h1>Registration Form</h1>
        <p>Enter your information to register.</p>

        <label for="fullname">Full name</label>
        <input id="fullname" type="text" placeholder="Enter your full name">

        <label for="reg-email">Email address</label>
        <input id="reg-email" type="email" placeholder="Enter your email">

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="Enter your phone number">

        <a class="button" href="indexwelco.html">Register</a>

        <a class="button google-option" href="indexgoogle.html">Continue with Google Account</a>
    </main>
</body>
</html>
